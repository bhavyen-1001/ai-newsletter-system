[project]
name = "ai-research-newsletter"
version = "0.1.0"
description = "Weekly AI research newsletter from Hugging Face Trending Papers."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "huggingface_hub>=0.34,<2",
    "PyMuPDF>=1.24,<2",
    "python-dotenv>=1,<2",
    "requests>=2.32,<3",
    "tenacity>=8.2,<10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
